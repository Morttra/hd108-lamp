; HD108 lounge lamp — ESP32 driving HD108 16-bit RGB LED strips over hardware
; SPI (VSPI: data GPIO 23, clock GPIO 18). Pins, LED count and geometry live
; in include/config.h; WiFi/MQTT/OTA credentials in include/secrets.h.

[platformio]
default_envs = lamp
; Optional, gitignored per-machine overrides (OTA password and host): copy
; platformio_local.ini.example to platformio_local.ini. Silently skipped
; when the file does not exist.
extra_configs = platformio_local.ini

; Uses the community pioarduino platform fork for Arduino core 3.x — the
; official espressif32 platform is stuck on core 2.x. Built and tested with
; pioarduino 55.03.39 (Arduino core 3.3.9).
[env:lamp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    dawidchyrzynski/home-assistant-integration @ ^2.1.0
build_flags =
    -Wall
; Uploads go over USB until platformio_local.ini switches this env to OTA.

; USB flashing regardless of platformio_local.ini (first flash, recovery):
;   pio run -e lamp-usb -t upload
[env:lamp-usb]
extends = env:lamp
upload_protocol = esptool
upload_port =
upload_flags =
